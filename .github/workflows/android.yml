name: Build StrikeFront APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rehydrate StrikeFront source
        run: |
          cat payload/strikefront.part* > strikefront-project.b64
          base64 --decode strikefront-project.b64 > strikefront-project.zip
          unzip -q strikefront-project.zip
          test -f strikefront_project/settings.gradle.kts
          test -f strikefront_project/app/src/main/java/com/strikefront/zerohour/GameView.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon -p strikefront_project :app:assembleDebug

      - name: Rename APK
        run: cp strikefront_project/app/build/outputs/apk/debug/app-debug.apk StrikeFront-Zero-Hour-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StrikeFront-Zero-Hour-v1-APK
          path: StrikeFront-Zero-Hour-v1.apk
          if-no-files-found: error
