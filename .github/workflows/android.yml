name: Build Neon Rift APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rehydrate Neon Rift source
        run: |
          cat payload/neonrift.part* > neonrift-project.b64
          base64 --decode neonrift-project.b64 > neonrift-project.zip
          unzip -q neonrift-project.zip
          test -f neonrift_project/settings.gradle.kts
          test -f neonrift_project/app/src/main/java/com/neonrift/botstorm/ArenaView.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon -p neonrift_project :app:assembleDebug

      - name: Rename APK
        run: cp neonrift_project/app/build/outputs/apk/debug/app-debug.apk Neon-Rift-Botstorm-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Rift-Botstorm-v1-APK
          path: Neon-Rift-Botstorm-v1.apk
          if-no-files-found: error
